<script data-hybridag-public-review>(function(){
window.HybridAgReleaseMode="pages-review";
window.HybridAgCartPreview={root:"",storageKey:"hybridag_pages_review_cart_v1",holdCheckout:true};
var message="This public review does not send enquiries, sign-ins or orders. Contact the Hybrid-Ag team directly.";
function isApi(input){
var url=new URL(input&&input.url||input,location.href);
var path=url.pathname;
try{path=decodeURIComponent(path);}catch(error){}
return /(^|\/)api(?:\/|$)/i.test(path);
}
function blocked(){return new DOMException(message,"InvalidStateError");}
var originalFetch=window.fetch;
window.fetch=function(input,options){
if(isApi(input)){
var path=new URL(input&&input.url||input,location.href).pathname;
return Promise.resolve(new Response(JSON.stringify({error:"public_review_only",message:message}),{status:/\/api\/leads$/.test(path)?422:503,headers:{"Content-Type":"application/json"}}));
}
return originalFetch.call(window,input,options);
};
if(window.XMLHttpRequest){
var originalOpen=XMLHttpRequest.prototype.open;
XMLHttpRequest.prototype.open=function(method,url){if(isApi(url))throw blocked();return originalOpen.apply(this,arguments);};
}
if(navigator.sendBeacon){
var originalBeacon=navigator.sendBeacon;
navigator.sendBeacon=function(url,data){return isApi(url)?false:originalBeacon.call(navigator,url,data);};
}
["WebSocket","EventSource"].forEach(function(name){
if(window[name])window[name]=new Proxy(window[name],{construct:function(target,args){if(isApi(args[0]))throw blocked();return Reflect.construct(target,args);}});
});
document.addEventListener("submit",function(event){if(isApi(event.target.action)){event.preventDefault();event.stopImmediatePropagation();}},true);
})();</script>
